<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Fuel — Información Física</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { electric: '#14ff69', sage: '#749a76', frost: '#f1fcf1', forest: '#131e13' },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse 160% 55% at 50% -5%, #1a2e1c 0%, #060d06 65%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 16px;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .phone-frame {
      width: 390px; height: 844px; background: #131e13;
      border-radius: 50px; overflow: hidden; position: relative; flex-shrink: 0;
      box-shadow: 0 0 0 1.5px rgba(116,154,118,0.18), 0 50px 120px rgba(0,0,0,0.85),
        0 0 120px rgba(20,255,105,0.07), inset 0 1px 0 rgba(255,255,255,0.04);
      animation: fadeUp 0.45s ease-out;
    }
    .dynamic-island { position: absolute; left: 50%; transform: translateX(-50%); top: 11px; width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 20; }
    .status-bar { height: 54px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: flex-start; }
    .phone-body { height: calc(844px - 54px); padding: 0 30px 44px; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none; }
    .phone-body::-webkit-scrollbar { display: none; }
    .fuel-btn {
      width: 100%; background: #14ff69; color: #131e13;
      font-size: 16px; font-weight: 700; padding: 18px; border-radius: 999px;
      border: none; cursor: pointer; font-family: 'Inter', sans-serif; letter-spacing: -0.2px;
      transition: opacity 0.15s, transform 0.1s; box-shadow: 0 0 30px rgba(20,255,105,0.25);
      flex-shrink: 0;
    }
    .fuel-btn:hover { opacity: 0.88; }
    .fuel-btn:active { transform: scale(0.98); }
    .form-label { display: block; color: #749a76; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 8px; }
    .fuel-input {
      width: 100%; background: rgba(116,154,118,0.07); border: 1.5px solid rgba(116,154,118,0.28);
      border-radius: 14px; padding: 14px 18px; color: #f1fcf1; font-size: 16px;
      font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .fuel-input:focus { border-color: #14ff69; background: rgba(20,255,105,0.04); box-shadow: 0 0 0 4px rgba(20,255,105,0.08); }
    .fuel-input::placeholder { color: rgba(116,154,118,0.5); }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .pill-option {
      flex: 1; text-align: center; padding: 12px 8px; border-radius: 999px;
      border: 1.5px solid rgba(116,154,118,0.28); color: #749a76; font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; user-select: none; background: transparent;
    }
    .pill-option.selected { background: #14ff69; border-color: #14ff69; color: #131e13; font-weight: 700; }
    .pill-option:not(.selected):hover { border-color: rgba(116,154,118,0.5); color: #f1fcf1; }
    .unit-toggle {
      display: flex; border-radius: 10px; border: 1.5px solid rgba(116,154,118,0.28); overflow: hidden; flex-shrink: 0;
    }
    .unit-btn {
      padding: 0 14px; height: 100%; font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; border: none; transition: all 0.15s; user-select: none;
      background: transparent; color: rgba(116,154,118,0.6);
    }
    .unit-btn.active { background: #14ff69; color: #131e13; }
    .unit-btn:not(.active):hover { background: rgba(116,154,118,0.12); color: #f1fcf1; }
    .page-label { color: rgba(116,154,118,0.28); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- Page nav -->
  <div style="width:390px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
    <a href="01_name.html" style="color:rgba(116,154,118,0.45);font-size:13px;text-decoration:none;" onmouseover="this.style.color='#749a76'" onmouseout="this.style.color='rgba(116,154,118,0.45)'">← Anterior</a>
    <span style="color:rgba(116,154,118,0.32);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;">1.2 · Datos Físicos</span>
    <a href="03_goals.html" style="color:rgba(20,255,105,0.6);font-size:13px;text-decoration:none;" onmouseover="this.style.color='#14ff69'" onmouseout="this.style.color='rgba(20,255,105,0.6)'">Siguiente →</a>
  </div>

  <!-- Phone frame -->
  <div class="phone-frame">
    <div class="dynamic-island"></div>

    <!-- Status bar -->
    <div class="status-bar">
      <span style="color:rgba(241,252,241,0.72);font-size:13px;font-weight:600;">9:41</span>
      <div style="display:flex;align-items:center;gap:5px;">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="rgba(241,252,241,0.72)">
          <rect x="0" y="7.5" width="3" height="3.5" rx="0.5"/>
          <rect x="4.5" y="5" width="3" height="6" rx="0.5"/>
          <rect x="9" y="2.5" width="3" height="8.5" rx="0.5"/>
          <rect x="13.5" y="0" width="3" height="11" rx="0.5" opacity="0.3"/>
        </svg>
        <svg width="15" height="12" viewBox="0 0 16 12" fill="rgba(241,252,241,0.72)">
          <path d="M8 1.5C5.5 1.5 3.3 2.4 1.7 3.9L0.2 2.4C2.2 0.9 4.9 0 8 0s5.8.9 7.8 2.4L14.3 3.9C12.7 2.4 10.5 1.5 8 1.5z"/>
          <path d="M8 5.5a5 5 0 00-3.5 1.4L3 5.3A7 7 0 018 3.5a7 7 0 015 1.8l-1.5 1.6A5 5 0 008 5.5z"/>
          <circle cx="8" cy="10.5" r="1.5"/>
        </svg>
        <div style="width:25px;height:12px;border:1.5px solid rgba(241,252,241,0.65);border-radius:3px;padding:1.5px;position:relative;display:flex;align-items:center;">
          <div style="width:75%;height:100%;background:rgba(241,252,241,0.65);border-radius:1.5px;"></div>
          <div style="position:absolute;right:-4px;top:3px;width:3px;height:6px;background:rgba(241,252,241,0.65);border-radius:0 2px 2px 0;"></div>
        </div>
      </div>
    </div>

    <!-- Phone body -->
    <div class="phone-body">

      <!-- Logo -->
      <div style="display:flex;justify-content:center;margin-top:22px;margin-bottom:22px;">
        <div style="display:flex;align-items:center;gap:9px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#14ff69">
            <path d="M13 2L3.5 13.5H9.5L8 22L20.5 10.5H14.5L13 2Z"/>
          </svg>
          <span style="color:#f1fcf1;font-size:22px;font-weight:800;letter-spacing:-0.3px;">Fuel</span>
        </div>
      </div>

      <!-- Step dots -->
      <div style="display:flex;justify-content:center;gap:8px;margin-bottom:26px;">
        <div style="width:8px;height:8px;background:#14ff69;border-radius:999px;opacity:0.45;"></div>
        <div style="width:24px;height:8px;background:#14ff69;border-radius:999px;box-shadow:0 0 8px rgba(20,255,105,0.55);"></div>
        <div style="width:8px;height:8px;background:rgba(116,154,118,0.25);border-radius:999px;"></div>
        <div style="width:8px;height:8px;background:rgba(116,154,118,0.25);border-radius:999px;"></div>
        <div style="width:8px;height:8px;background:rgba(116,154,118,0.25);border-radius:999px;"></div>
      </div>

      <!-- Heading -->
      <div style="margin-bottom:26px;">
        <h1 style="color:#f1fcf1;font-size:26px;font-weight:800;line-height:1.2;margin:0 0 8px;">Cuéntanos sobre ti</h1>
        <p style="color:#749a76;font-size:13.5px;line-height:1.6;margin:0;">Esto nos ayuda a calcular tu plan<br/>nutricional ideal</p>
      </div>

      <!-- Edad -->
      <div style="margin-bottom:18px;">
        <label class="form-label">Edad</label>
        <div style="display:flex;align-items:center;gap:10px;">
          <input type="number" class="fuel-input" placeholder="Ej. 28" style="flex:1;" />
          <span style="color:#749a76;font-size:14px;font-weight:500;white-space:nowrap;">años</span>
        </div>
      </div>

      <!-- Sexo -->
      <div style="margin-bottom:18px;">
        <label class="form-label">Sexo biológico</label>
        <div style="display:flex;gap:10px;">
          <button class="pill-option" onclick="selectPill(this, 'sexo')">Masculino</button>
          <button class="pill-option" onclick="selectPill(this, 'sexo')">Femenino</button>
          <button class="pill-option" onclick="selectPill(this, 'sexo')">Otro</button>
        </div>
      </div>

      <!-- Peso -->
      <div style="margin-bottom:18px;">
        <label class="form-label">Peso</label>
        <div style="display:flex;align-items:stretch;gap:10px;">
          <input type="number" class="fuel-input" id="peso-input" placeholder="75" style="flex:1;" />
          <div class="unit-toggle" id="peso-toggle" style="height:auto;">
            <button class="unit-btn active" onclick="setUnit('peso', this, 'kg')">kg</button>
            <button class="unit-btn" onclick="setUnit('peso', this, 'lbs')">lbs</button>
          </div>
        </div>
      </div>

      <!-- Altura -->
      <div style="margin-bottom:22px;">
        <label class="form-label">Altura</label>
        <div style="display:flex;align-items:stretch;gap:10px;">
          <div id="altura-cm" style="flex:1;">
            <input type="number" class="fuel-input" id="altura-input" placeholder="175" style="width:100%;" />
          </div>
          <div class="unit-toggle" id="altura-toggle" style="height:auto;">
            <button class="unit-btn active" onclick="setUnit('altura', this, 'cm')">cm</button>
            <button class="unit-btn" onclick="setUnit('altura', this, 'ft')">ft</button>
          </div>
        </div>
      </div>

      <!-- Divider -->
      <div style="height:1px;background:rgba(116,154,118,0.12);margin-bottom:22px;"></div>

      <!-- Spacer -->
      <div style="flex:1;min-height:8px;"></div>

      <!-- Button -->
      <button class="fuel-btn" onclick="window.location.href='03_goals.html'">Continuar</button>

    </div>
  </div>

  <p class="page-label">FASE 1 · ONBOARDING · 1.2 – DATOS FÍSICOS</p>

  <script>
    function selectPill(el, group) {
      document.querySelectorAll(`[onclick="selectPill(this, '${group}')"]`).forEach(p => p.classList.remove('selected'));
      el.classList.add('selected');
    }

    function setUnit(field, btn, unit) {
      const container = document.getElementById(field + '-toggle');
      container.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (field === 'altura') {
        const wrapper = document.getElementById('altura-cm');
        if (unit === 'ft') {
          wrapper.innerHTML = `
            <div style="display:flex;gap:8px;">
              <input type="number" class="fuel-input" placeholder="5" style="width:70px;" />
              <span style="color:#749a76;font-size:14px;align-self:center;">ft</span>
              <input type="number" class="fuel-input" placeholder="10" style="width:70px;" />
              <span style="color:#749a76;font-size:14px;align-self:center;">in</span>
            </div>`;
        } else {
          wrapper.innerHTML = `<input type="number" class="fuel-input" id="altura-input" placeholder="175" style="width:100%;" />`;
        }
      }
    }
  </script>

</body>
</html>
